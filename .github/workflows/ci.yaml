name: build

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
    - name: build
      run: |
        nix build ".#default" -L --print-out-paths --no-link
