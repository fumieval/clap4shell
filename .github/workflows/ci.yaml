name: build

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
    - name: build
      run: |
        nix build ".#default" -L --print-out-paths --no-link
    - name: build aarch64
      run: |
        nix build .#clap4shell-aarch64 -L --print-out-paths --no-link
