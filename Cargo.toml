[package]
name = "clap4shell"
description = "rich getopts replacement for shell script"
homepage = "https://github.com/fumieval/clap4shell"
version = "0.4.0"
authors = ["Fumiaki Kinoshita <fumiexcel@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities", "command-line-interface"]

[dependencies]
clap = { version = "4.6.7", features = ["string", "env", "wrap_help"] }
clap_complete = "4.6.11"
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }

[dev-dependencies]
clap = { version = "4.6.7", features = ["string", "env", "wrap_help"] }
